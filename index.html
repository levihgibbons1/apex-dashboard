<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apex Macro · Progress</title>
<meta name="description" content="What Apex Macro is working on right now and how close it is to the tester build.">
<meta name="theme-color" content="#0b0708">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 2 29 28H3z' fill='%23ef4444'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true"></span><span>Apex Macro</span><span class="tag">Progress</span></div>
  <div class="updated" id="updated">Loading…</div>
</header>

<main id="app">
  <section class="hero card" id="hero"></section>

  <section class="card" id="routes-card">
    <div class="section-head">
      <h2>Route tests</h2>
      <span class="muted small-inline" id="routes-count"></span>
    </div>
    <p class="muted small" id="routes-note"></p>
    <div class="table-wrap">
      <table class="routes" id="routes">
        <thead>
          <tr>
            <th>Field</th>
            <th>Path out</th>
            <th>Walk home</th>
            <th>Full loop</th>
            <th>Note</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="card" id="building-card">
    <div class="section-head"><h2>Being built now</h2></div>
    <ul class="list" id="building"></ul>
  </section>

  <div class="grid">
    <section class="card needs" id="needs-card">
      <div class="section-head"><h2>Blocked / needs Levi</h2><span class="count" id="needs-count"></span></div>
      <ol class="list numbered" id="needs"></ol>
    </section>
    <section class="card" id="done-card">
      <div class="section-head"><h2>Done recently</h2></div>
      <ul class="list" id="done"></ul>
    </section>
  </div>
</main>

<footer class="foot" id="foot">Apex Macro · free and open source · this page refreshes itself every minute</footer>
<script src="app.js"></script>
</body>
</html>
